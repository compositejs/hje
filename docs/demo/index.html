<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta property="og:image" content="../images/bg/poster.jpg">
    <title>Hyper-JSON Engine Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/hje@2.4.6/docs/css/site.org.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/npm/hje@2.0.0/docs/images/logos/hje.png" />
    <link href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/styles/vs2015.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/datasense@3.2.0/dist/index.js" ></script>
    <script src="../js/dist/index.js" ></script>
</head>

<body>
    <header>
        <section>
            <h1><a href="https://composite.js.org"><strong>Composite</strong><span>Js</span></a></h1>
            <ul>
                <li>
                    <a href="https://datasense.js.org">DataSense</a>
                </li>
                <li class="state-sel">
                    <a href="https://hje.js.org">Hje</a>
                </li>
                <li>
                    <a href="https://langpack.js.org">LangPack</a>
                </li>
            </ul>
        </section>
    </header>
    <section>
        <section id="demo-container"></section>
    </section>
    <footer>
        <section>
            <div class="x-copyright">
                <span>CompositeJs &gt; </span><strong>Hje</strong><br /><br />
                <span>&copy; Kingcean Tuan 2025</span><br />
                <span>MIT licensed &nbsp; | &nbsp; Front-end</span>
            </div>
        </section>
    </footer>
    <script>
        const store = DataSense.createProps({
            value: "abc"
        });

        class A extends Hje.BaseComponent {
            constructor(arg) {
                super(arg);
                this.childrenAccess.set([
                    { key: "child", children: this.childrenAccess.text() },
                    { children: "Additional" }
                ]);
            }
            updateValue(value) {
                const m = this.getChild("child");
                m.prop("title", value);
                m.text(value);
            }
        }

        const testComponent = Hje.render("demo-container", {
            style: {
                "color": "#808080",
                "font-size": "14px"
            },
            children: [{
                component: A,
                key: "x",
                tagName: "p",
                children: "Greetings!",
                props: {
                    x: "abc"
                },
                on: {
                    click(ev) {
                        console.log("A click", ev);
                    }
                }
            }, {
                tagName: "ul",
                key: "list",
                component: Hje.ListComponent,
                data: {
                    source: ["ABCDEFG", "HIJKLMN", "OPQ RST", "UVW XYZ"],
                    item(m) {
                        return { tagName: "li", children: [{
                            tagName: "span",
                            children: m
                        }, {
                            tagName: "button",
                            children: "x",
                            on: {
                                click(ev) {
                                    testComponent.getChild("list").remove(m);
                                }
                            }
                        }] };
                    }
                },
                props: {
                    type: "circle",
                }
            }, {
                children: [{
                    tagName: "svg:svg",
                    props: {
                        width: 16,
                        height: 16,
                        version: "1.1"
                    },
                    children: [
                        {
                            tagName: "svg:path",
                            props: {
                                "fill-rule": "evenodd",
                                d: "M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1V9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 011-1h8zM5 12.25v3.25a.25.25 0 00.4.2l1.45-1.087a.25.25 0 01.3 0L8.6 15.7a.25.25 0 00.4-.2v-3.25a.25.25 0 00-.25-.25h-3.5a.25.25 0 00-.25.25z"
                            }
                        }
                    ]
                }]
            }, {
                children: [{
                    tagName: "button",
                    on: {
                        click(ev) {
                            store.setProp("value", new Date().toLocaleTimeString());
                        }
                    },
                    children: "Now"
                }, {
                    tagName: "input",
                    props: {
                        value: store.createPropObservable("value"),
                    },
                    on: {
                        change(ev) {
                            if (!ev.target) return;
                            store.setProp("value", ev.target.value);
                        }
                    }
                }, {
                    tagName: "button",
                    on: {
                        click(ev) {
                            const v = store.getProp("value");
                            const listComponent = testComponent.getChild("list");
                            if (v && v !== listComponent.last()) listComponent.push(v);
                        }
                    },
                    children: "Add"
                }]
            }],
            lifecycle: {
                load(component) {
                    const c = component.getChild("x");
                    setTimeout(() => {
                        c.updateValue("0123456789");
                    }, 2000);
                }
            }
        });
    </script>
</body>

</html>
